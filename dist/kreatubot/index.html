/* ── ChatStream component ── */
function ChatStream({ industry, autoPlay=true, speed=1 }) {
  const [visible, setVisible] = useState(0);
  const [typing, setTyping] = useState(false);
  const bodyRef = useRef(null);
  const timerRef = useRef([]);

  useEffect(() => {
    timerRef.current.forEach(clearTimeout); timerRef.current = [];
    setVisible(0); setTyping(false);
    if (!autoPlay) return;
    let acc = 400;
    industry.script.forEach((msg, i) => {
      const isBot = msg.from==="bot"||msg.from==="bot-card"||msg.from==="quick";
      const typingDelay = isBot && msg.from!=="quick" ? 700/speed : 0;
      if (typingDelay) {
        acc += 350/speed;
        timerRef.current.push(setTimeout(()=>setTyping(true), acc));
        acc += typingDelay;
        timerRef.current.push(setTimeout(()=>setTyping(false), acc));
      }
      acc += (msg.from==="user" ? 700 : 400)/speed;
      timerRef.current.push(setTimeout(()=>setVisible(i+1), acc));
    });
    return ()=>timerRef.current.forEach(clearTimeout);
  }, [industry.id, autoPlay, speed]);

  useEffect(()=>{ if(bodyRef.current) bodyRef.current.scrollTop=bodyRef.current.scrollHeight; },[visible,typing]);

  return (
    <div className="phone-wrap">
      <div className="phone">
        <div className="phone__screen">
          <div className="phone__statusbar">
            <span>9:41</span>
            <span><span style={{opacity:.9}}>●●●●</span><span style={{marginLeft:8}}>📶</span><span style={{marginLeft:6}}>🔋</span></span>
          </div>
          <div className="wa">
            <div className="wa__header">
              <span className="wa__back">‹</span>
              <span className="wa__avatar">{industry.avatar}</span>
              <span className="wa__name"><b>{industry.bizName}</b><span>en línea · responde en segundos</span></span>
              <span className="wa__icons"><span>📞</span><span>⋮</span></span>
            </div>
            <div className="wa__body" ref={bodyRef}>
              <div className="bubble bubble--system">Hoy · WhatsApp Business · cifrado</div>
              {industry.script.slice(0,visible).map((m,i)=>{
                if(m.from==="user") return <div key={i} className="bubble bubble--user"><span dangerouslySetInnerHTML={{__html:m.text}}/><span className="bubble__meta">9:4{i} <span className="bubble__check">✓✓</span></span></div>;
                if(m.from==="bot") return <div key={i} className="bubble bubble--bot"><span dangerouslySetInnerHTML={{__html:m.text}}/><span className="bubble__meta">9:4{i}</span></div>;
                if(m.from==="bot-card") return <div key={i} className="bubble bubble--bot bubble--card"><div className="card-img">[ imagen / ficha ]</div><div className="card-body"><b>{m.title}</b><small>{m.sub}</small></div></div>;
                if(m.from==="quick") return <div key={i} className="bubble--quick">{m.options.map((opt,j)=><button key={j}>{opt}</button>)}</div>;
                if(m.from==="system") return <div key={i} className="bubble bubble--system">{m.text}</div>;
                return null;
              })}
              {typing && <div className="typing"><span/><span/><span/></div>}
            </div>
            <div className="wa__input">
              <div className="wa__input-box">Escribe un mensaje…</div>
              <div className="wa__send">➤</div>
            </div>
          </div>
        </div>
      </div>
      <div className="phone-tag phone-tag--tl"><span className="pulse"></span><span>Atendiendo · <b>14 chats</b></span></div>
      <div className="phone-tag phone-tag--br"><span>⚡</span><span>Respuesta en <b>1.4 s</b></span></div>
    </div>
  );
}

/* ── ROI ── */
function ROI() {
  const [leads, setLeads] = useState(120);
  const [ticket, setTicket] = useState(1200);
  const [hours, setHours] = useState(10);
  const baseline = useMemo(()=>Math.round(leads*0.18*ticket),[leads,ticket]);
  const withBot  = useMemo(()=>Math.round(leads*0.36*ticket),[leads,ticket]);
  const lift = withBot - baseline;
  const savedTime = hours*4*4;
  return (
    <section className="roi" id="roi">
      <div className="shell">
        <div className="roi__grid">
          <div>
            <div className="eyebrow"><span className="dot"></span><span>04 / calculadora</span></div>
            <h2 className="section-title serif">¿Cuánto te <em className="italic">deja</em> KreatuBot?</h2>
            <p className="section-lede">Mueve las palancas. Calculamos un escenario conservador asumiendo que sin bot conviertes ~18 % y con KreatuBot subes a ~36 % (promedio de nuestros clientes a los 60 días).</p>
          </div>
          <div className="roi__panel">
            <div className="roi__row">
              <div className="roi__row-head"><span>Leads / mes en WhatsApp</span><b>{leads}</b></div>
              <input type="range" min="20" max="800" step="10" value={leads} onChange={e=>setLeads(+e.target.value)}/>
            </div>
            <div className="roi__row">
              <div className="roi__row-head"><span>Ticket promedio (MXN)</span><b>${ticket.toLocaleString()}</b></div>
              <input type="range" min="200" max="20000" step="100" value={ticket} onChange={e=>setTicket(+e.target.value)}/>
            </div>
            <div className="roi__row">
              <div className="roi__row-head"><span>Horas/día que tu equipo contesta</span><b>{hours} h</b></div>
              <input type="range" min="1" max="16" step="1" value={hours} onChange={e=>setHours(+e.target.value)}/>
            </div>
            <div className="roi__result">
              <div><div className="label">+ ingresos / mes</div><div className="value up">${lift.toLocaleString()}</div></div>
              <div><div className="label">horas devueltas / mes</div><div className="value">{savedTime} h</div></div>
            </div>
            <p className="roi__disclaimer">// estimación basada en uplift promedio de clientes activos · no es promesa de resultado</p>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── APP ── */
function App() {
  const [activeId, setActiveId] = useState("doctor");
  useEffect(()=>{
    const onClick = e => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute("href").slice(1);
      if (!id) return;
      const el = document.getElementById(id);
      if (el) { e.preventDefault(); window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-60,behavior:"smooth"}); }
    };
    document.addEventListener("click",onClick);
    return ()=>document.removeEventListener("click",onClick);
  },[]);
  return (
    <>
      <Nav/>
      <Hero/>
      <IndustriesStrip active={activeId} onPick={id=>{
        setActiveId(id);
        const el=document.getElementById("demo");
        if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-60,behavior:"smooth"});
      }}/>
      <Demo activeId={activeId} setActiveId={setActiveId}/>
      <Agents/>
      <How/>
      <ROI/>
      <Testimonials/>
      <Pricing/>
      <FAQ/>
      <CTA/>
      <Footer/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
